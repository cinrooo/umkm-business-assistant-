version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: umkm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: umkm_assistant
      POSTGRES_USER: umkm_user
      POSTGRES_PASSWORD: change_this_password
    ports:
      - "5432:5432"
    volumes:
      - umkm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umkm_user -d umkm_assistant"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  umkm_postgres_data:
